# Netlify configuration. The repo root is the site — nothing is built.

[build]
  publish = "."
  command = ""

# Fonts are content-stable: the filename only changes if the font itself does.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS and JS change while the site is being edited, so revalidate rather than
# cache hard. Netlify's ETags make this cheap.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The site loads nothing from anywhere else: CSS, JS, fonts and images are all
# self-hosted, and cal.com/LinkedIn are plain links rather than embeds. That
# makes a strict policy essentially free.
#
# The two sha256 values are the inline <script> blocks in index.html — the "js"
# class one in <head>, and the boot script at the end of <body>. Editing either
# one changes its hash and the browser will refuse to run it, so run
# tools/verify-csp.py after touching them.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-tHd4qJ0R/vQfI0CbRTiL3XGSi+Tun7VhOcDbx08aLKA=' 'sha256-aNxa2emwiM9awtp9xWk6r2SIb7IqFnvxqdYvKsn2qsQ=' https://app.cal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cal.com https://app.cal.com; font-src 'self'; connect-src 'self' https://api.cal.com https://app.cal.com https://cal.com; frame-src https://cal.com https://app.cal.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Netlify's injected badge script. Reserved /.netlify/ paths may ignore this,
# so the CSS rule is the guaranteed half of the fix.
[[redirects]]
  from = "/.netlify/scripts/hud"
  to = "/404.html"
  status = 404
  force = true

# The session tool holds client notes. It stays in the repo and works locally,
# but is not reachable on the live site. Delete this block to publish it.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  # Without force, a redirect only fires when no real file matches — and the
  # tool is a real file, so it was served instead.
  force = true
