# Netlify configuration. The repo root is the site — nothing is built.

[build]
  publish = "."
  command = ""

# Fonts are content-stable: the filename only changes if the font itself does.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS and JS change while the site is being edited, so revalidate rather than
# cache hard. Netlify's ETags make this cheap.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The site loads nothing from anywhere else: CSS, JS, fonts and images are all
# self-hosted, and cal.com/LinkedIn are plain links rather than embeds. That
# makes a strict policy essentially free.
#
# The two sha256 values are the inline <script> blocks in index.html — the "js"
# class one in <head>, and the boot script at the end of <body>. Editing either
# one changes its hash and the browser will refuse to run it, so run
# tools/verify-csp.py after touching them.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-tHd4qJ0R/vQfI0CbRTiL3XGSi+Tun7VhOcDbx08aLKA=' 'sha256-aNxa2emwiM9awtp9xWk6r2SIb7IqFnvxqdYvKsn2qsQ=' https://app.cal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cal.com https://app.cal.com; font-src 'self'; connect-src 'self' https://api.cal.com https://app.cal.com https://cal.com; frame-src https://cal.com https://app.cal.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# --- agent-facing files ---------------------------------------------------
# The .md sources are the same content the HTML pages are built from, served
# directly so an agent can read the site without parsing markup. Vary: Accept is
# set here as well as in the edge function, so the correct cache behaviour
# survives even if the function fails to deploy.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.well-known/mcp"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/agents"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# The four pages that negotiate on Accept (see
# netlify/edge-functions/content-negotiation.ts). Without Accept in Vary a CDN
# can serve a cached HTML variant to a client that asked for markdown.
[[headers]]
  for = "/"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/about"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/contact"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/privacy"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/terms"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/lost-recovery-phrase"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

# --- paths agents guess ----------------------------------------------------
# The Is Agentic scan's own agent probed /docs, /faq, /services and /pricing and
# hit 404s on all four. The site is one page with anchors, so those are real
# destinations that simply have no URL — these give them one. Kept as 301s so a
# crawler records the canonical target rather than the alias.
[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/#faq"
  status = 301

[[redirects]]
  from = "/how-it-works"
  to = "/#method"
  status = 301

[[redirects]]
  from = "/book"
  to = "/#book"
  status = 301

# Netlify's injected badge script. Reserved /.netlify/ paths may ignore this,
# so the CSS rule is the guaranteed half of the fix.
#
# The CSP now blocks this script outright, which is the outcome this redirect and
# that CSS rule were both reaching for. It leaves one console error on every
# production page load — "Executing inline script violates ... script-src" — and
# that error is EXPECTED. Nothing is broken by it: the badge is meant to be gone.
# It does not appear locally, because the badge is only injected on deploys.
#
# Do not "fix" it by adding the hash Chrome suggests. The hash changes whenever
# Netlify updates the badge, so it would need chasing forever, and allowing it
# would un-hide the thing being hidden.
[[redirects]]
  from = "/.netlify/scripts/hud"
  to = "/404.html"
  status = 404
  force = true

# The session tool holds client notes. It stays in the repo and works locally,
# but is not reachable on the live site. Delete this block to publish it.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  # Without force, a redirect only fires when no real file matches — and the
  # tool is a real file, so it was served instead.
  force = true
